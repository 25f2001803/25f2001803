{% extends "base.html" %}

{% block title %}
Create Trek
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-header">

                <h3>Create New Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label>Trek Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Location</label>
                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Difficulty</label>

                        <select
                            name="difficulty"
                            class="form-select"
                            required>

                            <option value="Easy">Easy</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Hard">Hard</option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label>Duration (Days)</label>
                        <input
                            type="number"
                            name="duration"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Maximum Slots</label>
                        <input
                            type="number"
                            name="max_slots"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Price</label>
                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">

                        <label>Status</label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"></textarea>

                    </div>

                    <button class="btn btn-success">

                        Create Trek

                    </button>

                    <a
                        href="{{ url_for('admin.manage_treks') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
