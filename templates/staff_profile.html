{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>My Profile</h2>

        <a href="{{ url_for('staff.staff_dashboard') }}"
           class="btn btn-secondary">

            ← Back

        </a>

    </div>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">Phone Number</label>

            <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ profile.phone }}"
            >

        </div>

        <div class="mb-3">

            <label class="form-label">Experience (Years)</label>

            <input
                type="number"
                name="experience"
                class="form-control"
                value="{{ profile.experience }}"
                min="0"
            >

        </div>

        <div class="mb-3">

            <label class="form-label">Bio</label>

            <textarea
                name="bio"
                class="form-control"
                rows="5"
            >{{ profile.bio }}</textarea>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
