{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-header">

                <h3>Edit Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label>Trek Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ trek.name }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Location</label>
                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            value="{{ trek.location }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Difficulty</label>

                        <select
                            name="difficulty"
                            class="form-select">

                            <option value="Easy"
                            {% if trek.difficulty=="Easy" %}selected{% endif %}>
                            Easy
                            </option>

                            <option value="Moderate"
                            {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                            Moderate
                            </option>

                            <option value="Hard"
                            {% if trek.difficulty=="Hard" %}selected{% endif %}>
                            Hard
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label>Duration</label>
                        <input
                            type="number"
                            name="duration"
                            class="form-control"
                            value="{{ trek.duration }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Maximum Slots</label>
                        <input
                            type="number"
                            name="max_slots"
                            class="form-control"
                            value="{{ trek.max_slots }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Available Slots</label>
                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            value="{{ trek.available_slots }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Price</label>
                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            value="{{ trek.price }}"
                            required>
                    </div>

                    <div class="mb-3">

                        <label>Status</label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Open"
                            {% if trek.status=="Open" %}selected{% endif %}>
                            Open
                            </option>

                            <option value="Closed"
                            {% if trek.status=="Closed" %}selected{% endif %}>
                            Closed
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4">{{ trek.description }}</textarea>

                    </div>

                    <button class="btn btn-warning">

                        Update Trek

                    </button>

                    <a href="{{ url_for('admin.manage_treks') }}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
